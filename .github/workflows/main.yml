name: Atualizar Dados da UFOPA

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Executar coletor inteligente
        run: node coletor.js

      - name: Processar dados e gerar dados.js
        run: node extrair_para_site.js

      - name: Commit e Push automáticos dos dados novos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dados.js
          git commit -m "🤖 Atualização automática e integrada dos dados" || echo "Sem alterações para commit"
          git push
